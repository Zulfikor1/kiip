<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIIP 모의고사 — Mock Test & Flashcards</title>
<style>
  :root{
    --bg:#0f1320; --card:#1a2032; --card2:#222a40; --accent:#4f9cff; --accent2:#ffcf4f;
    --text:#e8ecf5; --muted:#9aa6c2; --good:#3ddc84; --bad:#ff6b6b; --line:#2e3854;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.65;font-size:16px}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#1a2750,#222a40);
    padding:14px 18px;border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(0,0,0,.4)}
  header h1{margin:0;font-size:18px}
  header p{margin:3px 0 0;color:var(--muted);font-size:13px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tabs button,.tabs a{background:var(--card2);color:var(--text);border:1px solid var(--line);
    padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;text-decoration:none}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#06122a;font-weight:700}
  .wrap{max-width:920px;margin:0 auto;padding:18px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .controls select,.controls button{padding:9px 14px;border-radius:9px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:14px;cursor:pointer}
  .controls button.primary{background:var(--accent);color:#06122a;font-weight:700;border-color:var(--accent)}
  .progressbar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:10px 0 16px}
  .progressbar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));width:0;transition:width .3s}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
  .qnum{color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .qnum .sec{color:var(--accent2)}
  .qtext{font-weight:700;margin:8px 0 14px;font-size:17px}
  .opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:10px;
    border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;cursor:pointer;line-height:1.5}
  .opt:not(:disabled):hover{border-color:var(--accent)}
  .opt.correct{background:rgba(61,220,132,.15);border-color:var(--good);color:var(--good);font-weight:700}
  .opt.wrong{background:rgba(255,107,107,.15);border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default;opacity:.9}
  .expl{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--card2);
    border-left:4px solid var(--accent2);font-size:14px;display:none}
  .navrow{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
  .navrow button{padding:11px 20px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:15px;cursor:pointer}
  .navrow button.primary{background:var(--accent);color:#06122a;font-weight:700;border-color:var(--accent)}
  .navrow button:disabled{opacity:.4;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:14px 0}
  .grid button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);cursor:pointer;font-size:13px}
  .grid button.done-ok{background:rgba(61,220,132,.2);border-color:var(--good);color:var(--good)}
  .grid button.done-bad{background:rgba(255,107,107,.2);border-color:var(--bad);color:var(--bad)}
  .grid button.cur{outline:2px solid var(--accent)}
  .scorebox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center}
  .scorebox .big{font-size:42px;font-weight:800;color:var(--accent)}
  .scorebox .pass{color:var(--good);font-weight:700}
  .scorebox .fail{color:var(--bad);font-weight:700}
  /* Flashcards */
  .fcard{perspective:1200px;margin:14px 0;cursor:pointer;min-height:320px}
  .fcard-inner{position:relative;width:100%;min-height:320px;transition:transform .5s;transform-style:preserve-3d}
  .fcard.flipped .fcard-inner{transform:rotateY(180deg)}
  .fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
    display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
  .fface.back{transform:rotateY(180deg);border-color:var(--accent)}
  .fface .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:12px}
  .fface .fq{font-weight:700;font-size:17px}
  .fface ol{margin:10px 0 0;padding-left:0;list-style:none;font-size:14px;color:var(--muted)}
  .fface ol li{margin:4px 0}
  .fface .fans{color:var(--good);font-weight:800;font-size:18px;margin-bottom:10px}
  .fface .fexpl{font-size:14px;border-left:4px solid var(--accent2);padding-left:12px}
  .fmeta{color:var(--muted);font-size:13px;margin-bottom:6px}
  .fmeta .sec{color:var(--accent2)}
  @media (max-width:600px){ .fface .fq{font-size:15px} .qtext{font-size:15px} }
  /* Grammatika */
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
  .gform{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:.3px}
  .gmean{margin:8px 0 12px;font-size:16px;color:var(--text)}
  .guse{background:var(--card2);border-radius:9px;padding:10px 13px;font-size:14px;color:var(--muted);margin-bottom:12px}
  .guse b{color:var(--accent2)}
  .gex{display:flex;flex-direction:column;gap:8px}
  .gexrow{border-left:4px solid var(--good);padding:6px 0 6px 12px}
  .gexrow .gko{display:block;font-size:16px;font-weight:600;color:var(--text)}
  .gexrow .guz{display:block;font-size:14px;color:var(--muted);margin-top:2px}
  .gtip{margin-top:12px;padding:10px 13px;border-radius:9px;background:rgba(255,207,79,.12);
    border-left:4px solid var(--accent2);font-size:14px}
  /* To'ldirish (fill-in-the-blank) */
  .subtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .subtabs button{background:var(--card2);color:var(--text);border:1px solid var(--line);
    padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600}
  .subtabs button.active{background:var(--accent2);border-color:var(--accent2);color:#2a2200;font-weight:800}
  .fillcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
  .fillhead{font-weight:800;font-size:16px;color:var(--accent2);margin-bottom:12px}
  .fillline{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:16px;line-height:2.1}
  .fillline:first-of-type{border-top:none}
  .filltext{flex:1}
  .blank{display:inline-block;min-width:70px;text-align:center;border-bottom:2px solid var(--accent);
    color:transparent;padding:0 8px;margin:0 2px;font-weight:700;cursor:pointer;user-select:none;
    border-radius:4px 4px 0 0;transition:background .2s}
  .blank:hover{background:rgba(79,156,255,.12)}
  .blank.shown{color:var(--good);border-bottom-color:var(--good);background:rgba(61,220,132,.14);cursor:default}
  .fillbtn{flex-shrink:0;padding:6px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--card2);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;margin-top:6px}
  .fillbtn:hover{border-color:var(--accent);color:var(--text)}
  /* Side notes */
  .notetab{position:fixed;right:0;top:130px;z-index:59;writing-mode:vertical-rl;
    background:var(--accent2);color:#06122a;border:none;border-radius:10px 0 0 10px;
    padding:14px 9px;cursor:pointer;font-weight:800;font-size:13px;letter-spacing:1px;
    box-shadow:-2px 2px 10px rgba(0,0,0,.4)}
  .notetab.hasnote::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;
    border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--accent2)}
  .notebody{position:fixed;right:0;top:118px;z-index:61;width:320px;max-width:88vw;
    max-height:calc(100vh - 140px);display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-right:none;
    border-radius:12px 0 0 12px;box-shadow:-4px 0 22px rgba(0,0,0,.5);padding:14px;
    transform:translateX(105%);transition:transform .28s ease}
  .notepanel:not(.collapsed) .notebody{transform:translateX(0)}
  .notehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .notehead #noteLabel{font-weight:700;font-size:14px;color:var(--accent2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .noteclose{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
  #noteArea{width:100%;flex:1;min-height:220px;resize:vertical;padding:11px 12px;
    border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);
    font-size:14px;line-height:1.6;font-family:inherit}
  #noteArea:focus{outline:none;border-color:var(--accent)}
  .noterow{display:flex;align-items:center;gap:10px;margin-top:10px}
  .noterow button{padding:9px 16px;border-radius:9px;border:1px solid var(--accent);
    background:var(--accent);color:#06122a;font-weight:700;font-size:14px;cursor:pointer}
  .notestatus{color:var(--good);font-size:13px;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>🎯 KIIP 종합평가 모의고사</h1>
  <p>Mock test va flashcardlar — har kuni yangi test qo'shiladi</p>
  <div class="tabs">
    <a href="index.html">← 공부 자료</a>
    <button id="tab-test" class="active" onclick="showMode('test')">📝 Test</button>
    <button id="tab-flash" onclick="showMode('flash')">🃏 Flashcard</button>
    <button id="tab-vocab" onclick="showMode('vocab')">📚 So'z bilimi</button>
    <button id="tab-grammar" onclick="showMode('grammar')">📖 Grammatika</button>
    <button id="tab-fill" onclick="showMode('fill')">✏️ To'ldirish</button>
  </div>
</header>

<div class="wrap">
  <div class="controls" id="sharedControls">
    <select id="testSelect" onchange="loadTest()"></select>
    <button class="primary" onclick="restart()">🔄 Boshidan</button>
    <button id="shuffleBtn" onclick="toggleShuffle()">🔀 Aralashtirish: OFF</button>
  </div>

  <!-- TEST MODE -->
  <section id="mode-test">
    <div class="progressbar"><div id="pbar"></div></div>
    <div class="grid" id="qgrid"></div>
    <div id="qarea"></div>
  </section>

  <!-- FLASHCARD MODE -->
  <section id="mode-flash" style="display:none">
    <div class="progressbar"><div id="fbar"></div></div>
    <div id="farea"></div>
    <div class="navrow">
      <button onclick="fprev()">← Oldingi</button>
      <span id="fcount" style="color:var(--muted)"></span>
      <button class="primary" onclick="fnext()">Keyingi →</button>
    </div>
  </section>

  <!-- SO'Z BILIMI (VOCAB QUIZ) -->
  <section id="mode-vocab" style="display:none">
    <div class="controls">
      <select id="vocabSetSelect" onchange="loadVocabSet()"></select>
      <button class="primary" onclick="restartVocab()">🔄 Boshidan</button>
      <button id="vocabDirBtn" onclick="toggleVocabDir()">🇰🇷→🇺🇿 Ma'nosini top</button>
    </div>
    <div class="progressbar"><div id="vpbar"></div></div>
    <div class="grid" id="vgrid"></div>
    <div id="varea"></div>
  </section>

  <!-- GRAMMATIKA (O'QUV BO'LIMI) -->
  <section id="mode-grammar" style="display:none">
    <div class="controls">
      <select id="grammarSetSelect" onchange="renderGrammar()"></select>
    </div>
    <div id="garea"></div>
  </section>

  <!-- TO'LDIRISH (FILL-IN-THE-BLANK) -->
  <section id="mode-fill" style="display:none">
    <div id="fillUnitTabs" class="subtabs"></div>
    <div class="controls">
      <select id="fillSetSelect" onchange="renderFill()"></select>
      <button id="fillToggleBtn" class="primary" onclick="toggleFillAll()">👁️ Barcha javoblar</button>
    </div>
    <div id="fillarea"></div>
  </section>
</div>

<!-- SIDE NOTES -->
<div id="notePanel" class="notepanel collapsed" style="display:none">
  <button class="notetab" onclick="toggleNote()">📝 Note</button>
  <div class="notebody">
    <div class="notehead">
      <span id="noteLabel">Note</span>
      <button class="noteclose" onclick="toggleNote()" title="Yopish">✕</button>
    </div>
    <textarea id="noteArea" placeholder="Bu test/dars uchun eslatma yozing..."></textarea>
    <div class="noterow">
      <button onclick="saveNote()">💾 Saqlash</button>
      <span id="noteStatus" class="notestatus"></span>
    </div>
  </div>
</div>

<script src="mock-data.js"></script>
<script src="vocab-data.js"></script>
<script src="grammar-data.js"></script>
<script src="fill-data.js"></script>
<script>
const CIRC = ["①","②","③","④"];
let test = null, order = [], answers = {}, cur = 0, shuffled = false;
let fIdx = 0, mode = "test";

function init(){
  const sel = document.getElementById("testSelect");
  sel.innerHTML = MOCK_TESTS.map((t,i)=>`<option value="${i}">${t.title} (${t.questions.length} savol)</option>`).join("");
  sel.value = MOCK_TESTS.length - 1;
  loadTest();
  if (typeof VOCAB_SETS !== "undefined") initVocab();
  if (typeof GRAMMAR_SETS !== "undefined") initGrammar();
  if (typeof FILL_SETS !== "undefined") initFill();
}

function loadTest(){
  test = MOCK_TESTS[+document.getElementById("testSelect").value];
  restart();
  refreshNote();
}

function restart(){
  order = test.questions.map((_,i)=>i);
  if (shuffled) shuffle(order);
  answers = {}; cur = 0; fIdx = 0;
  render(); renderFlash();
}

function toggleShuffle(){
  shuffled = !shuffled;
  document.getElementById("shuffleBtn").textContent = "🔀 Aralashtirish: " + (shuffled?"ON":"OFF");
  restart();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function showMode(m){
  mode = m;
  document.getElementById("tab-test").classList.toggle("active", m==="test");
  document.getElementById("tab-flash").classList.toggle("active", m==="flash");
  document.getElementById("tab-vocab").classList.toggle("active", m==="vocab");
  document.getElementById("tab-grammar").classList.toggle("active", m==="grammar");
  document.getElementById("tab-fill").classList.toggle("active", m==="fill");
  document.getElementById("mode-test").style.display = m==="test" ? "" : "none";
  document.getElementById("mode-flash").style.display = m==="flash" ? "" : "none";
  document.getElementById("mode-vocab").style.display = m==="vocab" ? "" : "none";
  document.getElementById("mode-grammar").style.display = m==="grammar" ? "" : "none";
  document.getElementById("mode-fill").style.display = m==="fill" ? "" : "none";
  document.getElementById("sharedControls").style.display = (m==="test"||m==="flash") ? "" : "none";
  refreshNote();
}

/* ---------- TEST MODE ---------- */
function render(){
  const total = order.length, done = Object.keys(answers).length;
  document.getElementById("pbar").style.width = (done/total*100) + "%";

  const grid = document.getElementById("qgrid");
  grid.innerHTML = order.map((qi,pos)=>{
    const q = test.questions[qi];
    let cls = answers[qi]===undefined ? "" : (answers[qi]===q.answer ? "done-ok" : "done-bad");
    if (pos===cur) cls += " cur";
    return `<button class="${cls}" onclick="goTo(${pos})">${q.n}</button>`;
  }).join("");

  if (done === total){ renderResult(); return; }

  const qi = order[cur], q = test.questions[qi];
  const answered = answers[qi] !== undefined;
  document.getElementById("qarea").innerHTML = `
    <div class="qcard">
      <div class="qnum"><span>Savol ${q.n} / ${total}</span><span class="sec">${q.sec}</span></div>
      <div class="qtext">${q.q}</div>
      ${q.opts.map((o,i)=>{
        let cls = "";
        if (answered){
          if (i===q.answer) cls = "correct";
          else if (i===answers[qi]) cls = "wrong";
        }
        return `<button class="opt ${cls}" ${answered?"disabled":""} onclick="pick(${qi},${i})">${CIRC[i]} ${o}</button>`;
      }).join("")}
      <div class="expl" style="display:${answered?"block":"none"}">💡 ${q.expl}</div>
      <div class="navrow">
        <button onclick="goTo(${cur-1})" ${cur===0?"disabled":""}>← Oldingi</button>
        <span style="color:var(--muted)">To'g'ri: <b style="color:var(--good)">${score()}</b> / ${done}</span>
        <button class="primary" onclick="nextUnanswered()">Keyingi →</button>
      </div>
    </div>`;
}

function pick(qi,i){
  if (answers[qi]!==undefined) return;
  answers[qi] = i;
  render();
}

function goTo(pos){
  if (pos<0 || pos>=order.length) return;
  cur = pos; render();
}

function nextUnanswered(){
  const total = order.length;
  for (let step=1; step<=total; step++){
    const pos = (cur+step) % total;
    if (answers[order[pos]]===undefined){ cur = pos; render(); return; }
  }
  render();
}

function score(){
  return Object.entries(answers).filter(([qi,a])=>test.questions[+qi].answer===a).length;
}

function renderResult(){
  const total = order.length, s = score(), pct = Math.round(s/total*100);
  const wrong = order.filter(qi=>answers[qi]!==test.questions[qi].answer);
  document.getElementById("qarea").innerHTML = `
    <div class="scorebox">
      <div class="big">${s} / ${total}</div>
      <div>${pct}% — <span class="${pct>=60?"pass":"fail"}">${pct>=60?"O'tdingiz! 합격 🎉":"Yana mashq qiling 불합격"}</span></div>
      <p style="color:var(--muted);font-size:13px">(종합평가 o'tish chegarasi odatda 60%)</p>
      <button class="opt" style="text-align:center" onclick="restart()">🔄 Qayta ishlash</button>
    </div>
    ${wrong.length ? `<h3 style="color:var(--bad)">❌ Xato qilingan savollar (${wrong.length})</h3>` : ""}
    ${wrong.map(qi=>{
      const q = test.questions[qi];
      return `<div class="qcard">
        <div class="qnum"><span>Savol ${q.n}</span><span class="sec">${q.sec}</span></div>
        <div class="qtext">${q.q}</div>
        <div style="color:var(--bad)">Sizning javob: ${CIRC[answers[qi]]} ${q.opts[answers[qi]]}</div>
        <div style="color:var(--good);font-weight:700">To'g'ri javob: ${CIRC[q.answer]} ${q.opts[q.answer]}</div>
        <div class="expl" style="display:block">💡 ${q.expl}</div>
      </div>`;
    }).join("")}`;
}

/* ---------- FLASHCARD MODE ---------- */
function renderFlash(){
  const total = order.length;
  if (fIdx >= total) fIdx = 0;
  const qi = order[fIdx], q = test.questions[qi];
  document.getElementById("fbar").style.width = ((fIdx+1)/total*100) + "%";
  document.getElementById("fcount").textContent = (fIdx+1) + " / " + total;
  document.getElementById("farea").innerHTML = `
    <div class="fcard" id="fcard" onclick="this.classList.toggle('flipped')">
      <div class="fcard-inner">
        <div class="fface">
          <div class="fmeta">Savol ${q.n} · <span class="sec">${q.sec}</span></div>
          <div class="fq">${q.q}</div>
          <ol>${q.opts.map((o,i)=>`<li>${CIRC[i]} ${o}</li>`).join("")}</ol>
          <div class="hint">Javobni ko'rish uchun bosing 👆</div>
        </div>
        <div class="fface back">
          <div class="fans">✅ ${CIRC[q.answer]} ${q.opts[q.answer]}</div>
          <div class="fexpl">💡 ${q.expl}</div>
          <div class="hint">Savolga qaytish uchun bosing 👆</div>
        </div>
      </div>
    </div>`;
}
function fnext(){ fIdx = (fIdx+1) % order.length; renderFlash(); }
function fprev(){ fIdx = (fIdx-1+order.length) % order.length; renderFlash(); }

/* ---------- SO'Z BILIMI (VOCAB QUIZ) ---------- */
let vDir = "ko2uz", vWords = [], vQuestions = [], vAnswers = {}, vCur = 0;

function initVocab(){
  const sel = document.getElementById("vocabSetSelect");
  sel.innerHTML = VOCAB_SETS.map((s,i)=>`<option value="${i}">${s.title} (${s.words.length} so'z)</option>`).join("");
  loadVocabSet();
}

function loadVocabSet(){
  vWords = VOCAB_SETS[+document.getElementById("vocabSetSelect").value].words;
  restartVocab();
}

function restartVocab(){
  const idx = vWords.map((_,i)=>i);
  shuffle(idx);
  vQuestions = idx.map(wi=>{
    const others = vWords.map((_,i)=>i).filter(i=>i!==wi);
    shuffle(others);
    const opts = [wi,...others.slice(0,3)];
    shuffle(opts);
    return {wi, opts};
  });
  vAnswers = {}; vCur = 0;
  renderVocab();
}

function toggleVocabDir(){
  vDir = vDir==="ko2uz" ? "uz2ko" : "ko2uz";
  document.getElementById("vocabDirBtn").textContent =
    vDir==="ko2uz" ? "🇰🇷→🇺🇿 Ma'nosini top" : "🇺🇿→🇰🇷 Koreyscha top";
  restartVocab();
}

function renderVocab(){
  const total = vQuestions.length, done = Object.keys(vAnswers).length;
  document.getElementById("vpbar").style.width = (done/total*100)+"%";

  document.getElementById("vgrid").innerHTML = vQuestions.map((_,pos)=>{
    let cls = vAnswers[pos]===undefined ? "" : (vAnswers[pos].ok ? "done-ok" : "done-bad");
    if (pos===vCur) cls += " cur";
    return `<button class="${cls}" onclick="vGoTo(${pos})">${pos+1}</button>`;
  }).join("");

  if (done===total){ renderVocabResult(); return; }

  const {wi, opts} = vQuestions[vCur];
  const word = vWords[wi];
  const answered = vAnswers[vCur]!==undefined;
  const qText = vDir==="ko2uz" ? word.ko : word.uz;

  document.getElementById("varea").innerHTML = `
    <div class="qcard">
      <div class="qnum"><span>So'z ${vCur+1} / ${total}</span></div>
      <div class="qtext" style="font-size:26px;text-align:center;padding:16px 0;letter-spacing:.5px">${qText}</div>
      ${opts.map((oi,i)=>{
        const optText = vDir==="ko2uz" ? vWords[oi].uz : vWords[oi].ko;
        const isCorrect = oi===wi;
        let cls="";
        if(answered){ if(isCorrect) cls="correct"; else if(vAnswers[vCur].picked===i) cls="wrong"; }
        return `<button class="opt ${cls}" ${answered?"disabled":""} onclick="pickVocab(${vCur},${i},${isCorrect?1:0})">${CIRC[i]} ${optText}</button>`;
      }).join("")}
      ${answered ? `<div class="expl" style="display:block">💡 <b>${word.ko}</b> — ${word.uz}</div>` : ""}
      <div class="navrow">
        <button onclick="vGoTo(${vCur-1})" ${vCur===0?"disabled":""}>← Oldingi</button>
        <span style="color:var(--muted)">To'g'ri: <b style="color:var(--good)">${vScore()}</b> / ${done}</span>
        <button class="primary" onclick="vNext()">Keyingi →</button>
      </div>
    </div>`;
}

function pickVocab(pos, optIdx, isCorrect){
  if (vAnswers[pos]!==undefined) return;
  vAnswers[pos] = {picked:optIdx, ok:!!isCorrect};
  renderVocab();
}

function vGoTo(pos){
  if (pos<0||pos>=vQuestions.length) return;
  vCur=pos; renderVocab();
}

function vNext(){
  const total=vQuestions.length;
  for(let s=1;s<=total;s++){
    const p=(vCur+s)%total;
    if(vAnswers[p]===undefined){vCur=p;renderVocab();return;}
  }
  renderVocab();
}

function vScore(){
  return Object.values(vAnswers).filter(a=>a.ok).length;
}

function renderVocabResult(){
  const total=vQuestions.length, s=vScore(), pct=Math.round(s/total*100);
  const wrong=vQuestions.map((_,i)=>i).filter(i=>!vAnswers[i]?.ok);
  document.getElementById("varea").innerHTML = `
    <div class="scorebox">
      <div class="big">${s} / ${total}</div>
      <div>${pct}% — <span class="${pct>=80?"pass":"fail"}">${pct>=80?"Ajoyib! 🎉":"Yana mashq qiling 💪"}</span></div>
      <button class="opt" style="text-align:center;margin-top:14px" onclick="restartVocab()">🔄 Qayta ishlash</button>
    </div>
    ${wrong.length ? `<h3 style="color:var(--bad);margin-top:20px">❌ Xato qilingan so'zlar (${wrong.length})</h3>` : ""}
    ${wrong.map(i=>{
      const {wi,opts}=vQuestions[i], word=vWords[wi];
      const pickedWord=vWords[opts[vAnswers[i].picked]];
      return `<div class="qcard">
        <div class="qtext" style="font-size:22px">${vDir==="ko2uz"?word.ko:word.uz}</div>
        <div style="color:var(--bad);margin:6px 0">Sizning javob: ${vDir==="ko2uz"?pickedWord.uz:pickedWord.ko}</div>
        <div style="color:var(--good);font-weight:700">To'g'ri: <b>${word.ko}</b> — ${word.uz}</div>
      </div>`;
    }).join("")}`;
}

/* ---------- GRAMMATIKA (O'QUV BO'LIMI) ---------- */
function initGrammar(){
  const sel = document.getElementById("grammarSetSelect");
  sel.innerHTML = GRAMMAR_SETS.map((s,i)=>`<option value="${i}">${s.title}</option>`).join("");
  renderGrammar();
}

function renderGrammar(){
  const set = GRAMMAR_SETS[+document.getElementById("grammarSetSelect").value];
  document.getElementById("garea").innerHTML = set.items.map(g=>`
    <div class="gcard">
      <div class="gform">${g.form}</div>
      <div class="gmean">${g.meaning}</div>
      <div class="guse"><b>Qoida:</b> ${g.usage}</div>
      <div class="gex">
        ${g.ex.map(e=>`<div class="gexrow"><span class="gko">${e.ko}</span><span class="guz">${e.uz}</span></div>`).join("")}
      </div>
      ${g.tip ? `<div class="gtip">${g.tip}</div>` : ""}
    </div>`).join("");
}

/* ---------- TO'LDIRISH (FILL-IN-THE-BLANK) ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

let fillUnit = null;
function fillUnitOf(s){ return s.title.split(" ")[0]; }  // "정치 ① ..." -> "정치"

function initFill(){
  const units = [];
  FILL_SETS.forEach(s=>{ const u = fillUnitOf(s); if (!units.includes(u)) units.push(u); });
  fillUnit = units[0];
  document.getElementById("fillUnitTabs").innerHTML = units.map(u=>
    `<button data-unit="${u}" onclick="selectFillUnit('${u}')">${u}</button>`).join("");
  selectFillUnit(fillUnit);
}

function selectFillUnit(u){
  fillUnit = u;
  document.querySelectorAll("#fillUnitTabs button").forEach(b=>
    b.classList.toggle("active", b.dataset.unit===u));
  const sel = document.getElementById("fillSetSelect");
  sel.innerHTML = FILL_SETS.map((s,i)=>({s,i}))
    .filter(o=>fillUnitOf(o.s)===u)
    .map(o=>`<option value="${o.i}">${o.s.title}</option>`).join("");
  renderFill();
}

function renderFill(){
  const set = FILL_SETS[+document.getElementById("fillSetSelect").value];
  let n = 0;
  document.getElementById("fillarea").innerHTML = set.sections.map(sec=>`
    <div class="fillcard">
      <div class="fillhead">${esc(sec.heading)}</div>
      ${sec.lines.map((line,li)=>{
        const html = line.parts.map(p=>{
          if (typeof p === "string") return esc(p);
          const id = "b"+(n++);
          return `<span class="blank" id="${id}" data-ans="${esc(p.a)}" onclick="revealBlank('${id}')">${esc(p.a)}</span>`;
        }).join("");
        return `<div class="fillline">
          <span class="filltext">${html}</span>
          <button class="fillbtn" onclick="revealLine(this)">Javob</button>
        </div>`;
      }).join("")}
    </div>`).join("");
  document.getElementById("fillToggleBtn").textContent = "👁️ Barcha javoblar";
  refreshNote();
}

function revealBlank(id){ document.getElementById(id).classList.add("shown"); }

function revealLine(btn){
  btn.closest(".fillline").querySelectorAll(".blank").forEach(b=>b.classList.add("shown"));
}

function toggleFillAll(){
  const blanks = document.querySelectorAll("#fillarea .blank");
  const anyHidden = [...blanks].some(b=>!b.classList.contains("shown"));
  blanks.forEach(b=>b.classList.toggle("shown", anyHidden));
  document.getElementById("fillToggleBtn").textContent = anyHidden ? "🙈 Yashirish" : "👁️ Barcha javoblar";
}

/* ---- Side notes (per test / per fill set, saqlanadi localStorage) ---- */
function currentNote(){
  if (mode==="test" && test)
    return {key:"kiip_note_test_"+(test.id||test.title), label:"📝 "+test.title};
  if (mode==="fill" && typeof FILL_SETS!=="undefined"){
    const sel=document.getElementById("fillSetSelect");
    const set=sel ? FILL_SETS[+sel.value] : null;
    if (set) return {key:"kiip_note_fill_"+(set.id||set.title), label:"✏️ "+set.title};
  }
  return null;
}
function refreshNote(){
  const panel=document.getElementById("notePanel");
  if (!panel) return;
  const info=currentNote();
  if (!info){ panel.style.display="none"; return; }
  panel.style.display="";
  panel.dataset.key=info.key;
  document.getElementById("noteLabel").textContent=info.label;
  const val=localStorage.getItem(info.key)||"";
  document.getElementById("noteArea").value=val;
  panel.querySelector(".notetab").classList.toggle("hasnote", !!val.trim());
  document.getElementById("noteStatus").textContent="";
}
function saveNote(){
  const panel=document.getElementById("notePanel");
  const key=panel.dataset.key; if(!key) return;
  const val=document.getElementById("noteArea").value;
  if (val.trim()) localStorage.setItem(key,val); else localStorage.removeItem(key);
  panel.querySelector(".notetab").classList.toggle("hasnote", !!val.trim());
  const s=document.getElementById("noteStatus"); s.textContent="✓ Saqlandi";
  setTimeout(()=>{ if(s.textContent==="✓ Saqlandi") s.textContent=""; },2000);
}
function toggleNote(){ document.getElementById("notePanel").classList.toggle("collapsed"); }

document.addEventListener("keydown", e=>{
  if (mode!=="flash") return;
  if (e.key==="ArrowRight") fnext();
  else if (e.key==="ArrowLeft") fprev();
  else if (e.key===" "){ e.preventDefault(); document.getElementById("fcard").classList.toggle("flipped"); }
});

init();
</script>
